apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pingvin-share-x.fullname" . }}-test-connection"
  labels:
    {{- include "pingvin-share-x.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: check-api
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      command:
        - sh
        - -c
        - |
          set -e
          echo "GET /api/health"
          wget -q -O - "http://{{ include "pingvin-share-x.fullname" . }}:{{ .Values.service.ports.api }}/api/health"
          echo
          echo "GET / (frontend)"
          wget -q -S -O /dev/null "http://{{ include "pingvin-share-x.fullname" . }}:{{ .Values.service.ports.http }}/"
