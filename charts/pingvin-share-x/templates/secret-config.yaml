{{- /*
  config.yaml holds smtp.password, ldap.bindPassword, oauth.*.clientSecret and
  S3 credentials, so it belongs in a Secret rather than a ConfigMap.
  Skipped when config.existingSecret points at a Secret you manage yourself.
*/}}
{{- if and .Values.config.enabled .Values.config.data (not .Values.config.existingSecret) }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "pingvin-share-x.fullname" . }}-config
  labels:
    {{- include "pingvin-share-x.labels" . | nindent 4 }}
stringData:
  config.yaml: |
    {{- toYaml .Values.config.data | nindent 4 }}
{{- end }}
