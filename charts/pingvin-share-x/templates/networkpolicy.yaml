{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pingvin-share-x.fullname" . }}
  labels:
    {{- include "pingvin-share-x.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pingvin-share-x.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- /*
      Only declare Egress when rules are given: an empty Egress policyType denies
      all outbound traffic, including DNS, and the app would stop resolving SMTP,
      OAuth, S3 or ClamAV.
    */}}
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: {{ .Values.containerPorts.http }}
          protocol: TCP
        - port: {{ .Values.containerPorts.api }}
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
