{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tapo-exporter.fullname" . }}
  labels:
    {{- include "tapo-exporter.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.credentials.emailKey }}: {{ .Values.credentials.email | b64enc | quote }}
  {{ .Values.credentials.passwordKey }}: {{ .Values.credentials.password | b64enc | quote }}
{{- end }}
