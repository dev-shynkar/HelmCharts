apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-ecoflow-exporter.fullname" . }}
  labels:
    {{- include "go-ecoflow-exporter.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.service.annotations | default dict) }}
  {{- if .Values.prometheusScrapeAnnotations.enabled }}
  {{- $_ := set $annotations "prometheus.io/scrape" "true" }}
  {{- $_ := set $annotations "prometheus.io/port" (.Values.service.port | toString) }}
  {{- $_ := set $annotations "prometheus.io/path" "/metrics" }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- /* Named "metrics" so a ServiceMonitor can select it by name. */}}
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "go-ecoflow-exporter.selectorLabels" . | nindent 4 }}
