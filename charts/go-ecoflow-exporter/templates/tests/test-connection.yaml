apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "go-ecoflow-exporter.fullname" . }}-test-connection"
  labels:
    {{- include "go-ecoflow-exporter.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: check-metrics
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      command:
        - sh
        - -c
        - |
          set -e
          URL="http://{{ include "go-ecoflow-exporter.fullname" . }}:{{ .Values.service.port }}/metrics"
          echo "GET $URL"
          BODY=$(wget -q -O - "$URL")
          echo "$BODY" | head -5
          # Only asserts the endpoint is up; device metrics appear once the
          # collector has completed its first cycle, which can take a while.
          echo "$BODY" | grep -q '^# HELP' || {
            echo "no Prometheus exposition format in response"; exit 1; }
          echo OK
