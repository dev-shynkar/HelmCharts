{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "go-ecoflow-exporter.fullname" . }}
  labels:
    {{- include "go-ecoflow-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "go-ecoflow-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- /*
      Only declare Egress when rules are given: an empty Egress policyType denies
      all outbound traffic, and the exporter would lose DNS along with its
      connection to EcoFlow's cloud.
    */}}
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
