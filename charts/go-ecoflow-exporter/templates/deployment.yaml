{{- include "go-ecoflow-exporter.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-ecoflow-exporter.fullname" . }}
  labels:
    {{- include "go-ecoflow-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}

  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}

  selector:
    matchLabels:
      {{- include "go-ecoflow-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "go-ecoflow-exporter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $annotations := deepCopy (.Values.podAnnotations | default dict) }}
      {{- if .Values.existingSecret.name }}
      {{- /* Credentials are read once at startup, so rotating them must roll the pod. */}}
      {{- $_ := set $annotations "checksum/secret" (include "go-ecoflow-exporter.secretChecksum" .) }}
      {{- end }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- /* Set unconditionally: the helper already resolves to "default" when create is false. */}}
      serviceAccountName: {{ include "go-ecoflow-exporter.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}

      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: exporter
          image: {{ include "go-ecoflow-exporter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: metrics
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          env:
            {{- include "go-ecoflow-exporter.env" . | trim | nindent 12 }}

          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}

          {{- if .Values.mqttStallRecovery.enabled }}
          {{- /*
            Restarts the pod once no device has been online for afterMinutes.
            periodSeconds is pinned to 60 so failureThreshold reads as minutes.
            A restart is the only exit from the upstream MQTT stall: it re-runs
            the EcoFlow login and picks up fresh MQTT credentials.
          */}}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  wget -q -O - "http://127.0.0.1:{{ .Values.containerPort }}/metrics" \
                    | awk '/^{{ .Values.exporter.metricPrefix }}_online[{ ]/ && $NF != 0 { ok = 1 } END { exit ok ? 0 : 1 }'
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: {{ .Values.mqttStallRecovery.afterMinutes }}
          {{- else if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
