{{- /*
  Run the probe as the same user the app runs as, so the test does not quietly
  pass under a UID the real workload never uses. env may be nil if a values file
  clears it, hence the guarded copy.
*/}}
{{- $env := .Values.env | default dict }}
{{- $tests := .Values.tests | default dict }}
{{- $uid := $tests.runAsUser | default ($env.UID | default "1000") | int }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "duplicati.fullname" . }}-test-connection"
  labels:
    {{- include "duplicati.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- if ne $uid 0 }}
    runAsNonRoot: true
    {{- end }}
    runAsUser: {{ $uid }}
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check-ui
      image: {{ $tests.image | default "busybox:1.36" | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      command:
        - sh
        - -c
        - |
          set -e
          {{- /*
            The Service DNS name is in the computed allowed-hostnames list, so
            the default Host header is accepted. A 200 here means the web
            service is up and did not reject us.
          */}}
          URL="http://{{ include "duplicati.fullname" . }}:{{ .Values.service.port }}/"
          echo "GET $URL"
          wget -S -q -O /dev/null "$URL" 2>&1 | sed -n '1,12p'
          wget -q -O /dev/null "$URL"
          echo OK
