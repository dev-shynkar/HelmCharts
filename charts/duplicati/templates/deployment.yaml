{{- include "duplicati.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duplicati.fullname" . }}
  labels:
    {{- include "duplicati.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}

  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}

  selector:
    matchLabels:
      {{- include "duplicati.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "duplicati.selectorLabels" . | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- /* podAnnotations wins over commonAnnotations on a shared key. */}}
      {{- $ann := merge (dict) (.Values.podAnnotations | default dict) (.Values.commonAnnotations | default dict) }}
      {{- with $ann }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "duplicati.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}

      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "duplicati.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          ports:
            - name: http
              containerPort: 8200
              protocol: TCP

          env:
            {{- include "duplicati.env" . | trim | nindent 12 }}

          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            {{- if .Values.persistence.config.enabled }}
            - name: config
              mountPath: /data
            {{- end }}
            {{- if .Values.persistence.source.enabled }}
            - name: source
              mountPath: /source
              readOnly: {{ .Values.persistence.source.readOnly }}
            {{- end }}
            {{- if .Values.persistence.backups.enabled }}
            - name: backups
              mountPath: /backups
              readOnly: {{ .Values.persistence.backups.readOnly }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}

          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}

          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}

        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      volumes:
        {{- if .Values.persistence.config.enabled }}
        {{- /* Config is always a PVC — /data must survive restarts. */}}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "duplicati.configClaimName" . }}
        {{- end }}

        {{- if .Values.persistence.source.enabled }}
        - name: source
          {{- if eq .Values.persistence.source.type "hostPath" }}
          hostPath:
            path: {{ .Values.persistence.source.hostPath }}
            {{- /*
              Directory by default: an auto-created empty directory here means
              Duplicati backs up nothing, records a successful version, and
              retention prunes the versions that held real data.
            */}}
            type: {{ .Values.persistence.source.hostPathType | default "Directory" }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "duplicati.sourceClaimName" . }}
          {{- end }}
        {{- end }}

        {{- if .Values.persistence.backups.enabled }}
        - name: backups
          {{- if eq .Values.persistence.backups.type "hostPath" }}
          hostPath:
            path: {{ .Values.persistence.backups.hostPath }}
            type: {{ .Values.persistence.backups.hostPathType | default "DirectoryOrCreate" }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "duplicati.backupsClaimName" . }}
          {{- end }}
        {{- end }}

        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
