{{- $p := .Values.persistence.source }}
{{- if and $p.enabled (eq $p.type "pvc") (not $p.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "duplicati.sourceClaimName" . }}
  labels:
    {{- include "duplicati.labels" . | nindent 4 }}
  {{- /* retain wins over commonAnnotations on the same key. */}}
  {{- $ann := merge (dict) ($p.annotations | default dict) (.Values.commonAnnotations | default dict) }}
  {{- if $p.retain }}
  {{- $_ := set $ann "helm.sh/resource-policy" "keep" }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $p.accessModes | nindent 4 }}
  {{- /* Guarded, unlike 0.18.x: an unguarded empty value renders as null,
         which means "default class" — not the same as "" ("no class"). */}}
  {{- if $p.storageClassName }}
  {{- if eq $p.storageClassName "-" }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ $p.storageClassName }}
  {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
