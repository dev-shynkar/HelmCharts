apiVersion: v1
kind: Service
metadata:
  name: {{ include "duplicati.fullname" . }}
  labels:
    {{- include "duplicati.labels" . | nindent 4 }}
  {{- $ann := merge (dict) (.Values.service.annotations | default dict) (.Values.commonAnnotations | default dict) }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (has .Values.service.type (list "NodePort" "LoadBalancer")) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "duplicati.selectorLabels" . | nindent 4 }}
