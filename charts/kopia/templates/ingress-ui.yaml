{{- if and (include "kopia.serverEnabled" .) .Values.ui.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kopia.uiFullname" . }}
  labels:
    {{- include "kopia.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- $ann := merge (dict) (.Values.ui.ingress.annotations | default dict) (.Values.commonAnnotations | default dict) }}
  {{- if eq .Values.ui.tls.mode "existing" }}
  {{- /*
    The backend speaks HTTPS with the certificate from ui.tls.existingSecret.
    nginx assumes HTTP unless told otherwise, so set it here rather than
    leaving a 502 to be debugged. Other controllers use their own annotation.
  */}}
  {{- $_ := set $ann "nginx.ingress.kubernetes.io/backend-protocol" "HTTPS" }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ui.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ui.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ui.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "kopia.uiFullname" $ }}
                port:
                  number: {{ $.Values.ui.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
