initContainers: []

# The `helm test` pod. It connects to the repository read-only using its own
# emptyDir cache, so it never touches the CronJob's state volume and can run
# while a backup is in progress.
tests:
  enabled: true
  # Empty means podSecurityContext.runAsUser.
  runAsUser: ""
