# Transmission (linuxserver.io image).
#
# The container listens on two things:
#   * 9091            web UI / RPC
#   * 51413 TCP+UDP   BitTorrent peer port
#
# The peer port is what lets other clients connect *to* you. A ClusterIP Service
# cannot receive those connections, so this chart binds the port on the node
# itself (hostPort) — see the peerPort section.

# Transmission keeps its whole state in /config on a ReadWriteOnce volume and
# holds the peer hostPort. Only one instance can run.
replicaCount: 1

image:
  repository: linuxserver/transmission
  pullPolicy: IfNotPresent
  # Defaults to Chart.AppVersion.
  #
  # NOTE: appVersion is pinned at 4.0.6 while linuxserver.io is shipping 4.1.x.
  # The 4.0.6 tag still exists but no longer receives base-image security
  # updates. Moving up is a deliberate choice — Transmission 4.1 rewrites
  # settings.json — so back up /config first, then set for example:
  #   tag: "4.1.3-r0-ls358"
  tag: ""
  # Takes precedence over tag, e.g. "sha256:abc123...".
  digest: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Labels and annotations added to every object this chart renders.
#
# commonLabels deliberately does NOT reach the selector labels
# (app.kubernetes.io/name + app.kubernetes.io/instance). A Deployment selector
# is immutable, so folding arbitrary labels into it would break every upgrade
# of an existing release.
commonLabels: {}
commonAnnotations: {}

# RollingUpdate deadlocks on the ReadWriteOnce config volume and on the peer
# hostPort — the new pod waits for resources the old pod still holds.
updateStrategy:
  type: Recreate

revisionHistoryLimit: 3

# Transmission writes resume files and statistics on shutdown. The default 30s
# can be short for a large torrent list, and a kill mid-write means re-verifying
# on the next start.
terminationGracePeriodSeconds: 90

podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  # Transmission never talks to the Kubernetes API, and it downloads arbitrary
  # content from the internet — do not hand it a cluster token.
  automount: false
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 9091
  annotations: {}
  nodePort: ""

# BitTorrent peer port.
#
# Without it Transmission can only open outgoing connections: seeding barely
# works and download speeds are a fraction of what they should be.
peerPort:
  enabled: true
  port: 51413

  # Bind the port directly on the node. This is what makes the port reachable;
  # forward it (TCP *and* UDP) on your router to that node's address.
  #
  # hostPort pins the pod to whichever node has the port free, so keep
  # replicaCount at 1 and set nodeSelector below if you have several nodes.
  hostPort: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: transmission.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Transmission is not resource-free: hash-checking is CPU heavy and a large
# torrent list costs real memory. Without a memory limit a runaway container
# can take the node's other pods down with it.
#
# 2Gi is headroom for a large library plus verification. Too low a limit gives
# you an OOMKill -> restart -> re-verify -> OOMKill loop, so check what you
# actually use before tightening it:
#   kubectl top pod -n <ns> -l app=transmission
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1000m"
    memory: 2Gi

# Applies to every container in the pod. RuntimeDefault does not conflict with
# the s6-overlay entrypoint below.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# The linuxserver.io image starts as root under s6-overlay and drops to
# PUID/PGID itself, so runAsNonRoot cannot be used as-is.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

  # Drop everything, then add back what s6-overlay needs:
  #   CHOWN, FOWNER, FSETID, DAC_OVERRIDE  chown /config to PUID:PGID
  #   SETUID, SETGID, SETFCAP, SETPCAP     s6-setuidgid dropping privileges
  #   KILL                                 s6-svscan supervising its services
  #   AUDIT_WRITE                          PAM writes an audit record
  #
  # What this actually buys you is the capabilities NOT in the list — above all
  # NET_RAW (raw sockets), plus MKNOD, SYS_CHROOT and NET_BIND_SERVICE. Both
  # ports this chart uses are above 1024, so nothing here needs to bind low.
  #
  # This set is wider than the one the duplicati chart uses because s6-overlay
  # does more at startup than a single chown + su. THIS IS THE ONE CHANGE IN
  # 0.5.0 THAT CAN STOP AN OTHERWISE-WORKING POD: if it crashloops at start,
  # comment out `capabilities` and nothing else. Do not switch back to root.
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - SETGID
      - SETUID
      - SETFCAP
      - SETPCAP
      - AUDIT_WRITE

# A large torrent list takes a while to load on start. The startup probe gives
# it up to 5 minutes before liveness is allowed to fire at all.
startupProbe:
  enabled: true
  tcpSocket:
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60

# tcpSocket rather than httpGet on purpose: Transmission checks authorization
# *before* it redirects "/" to the web UI (libtransmission/rpc-server.cc), so
# once auth.existingSecret is set an httpGet probe gets 401 and fails. A TCP
# check proves the RPC server is listening regardless of authentication.
readinessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

livenessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5

# RPC authentication.
#
# The image enables it only when USER and PASS are both set. Until then the web
# UI is completely open — anyone who can reach it can add torrents. Do not turn
# on the Ingress without this.
#
#   kubectl create secret generic transmission-auth \
#     --from-literal=USER=admin --from-literal=PASS='...'
auth:
  # Secret with USER and PASS keys.
  existingSecret: ""
  keys:
    username: USER
    password: PASS

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "Europe/Kyiv"

  # Comma-separated IP whitelist for the RPC interface (rpc-whitelist).
  # Leave unset to disable the whitelist entirely.
  # WHITELIST: "127.0.0.1,10.0.0.0/8,192.168.0.0/16"

  # Comma-separated DNS names allowed in the Host header (rpc-host-whitelist).
  # Unset by default, so an Ingress with any hostname works out of the box.
  # Note that enabling password auth also allows any hostname.
  # HOST_WHITELIST: "transmission.example.com"

  # TRANSMISSION_WEB_HOME: /combustion-release/

# PEERPORT is derived from peerPort.port and injected automatically; set it here
# to override.
extraEnv: []
# - name: TRANSMISSION_WEB_HOME
#   value: /flood-for-transmission/

envFrom: []
# - secretRef:
#     name: transmission-extra

persistence:
  # /config — settings.json, torrent state, resume files, statistics.
  config:
    enabled: false

    # A volume this chart does NOT manage — mounted only, never created and
    # never deleted. Do not use it to point at a PVC an earlier version of this
    # chart created: dropping that PVC out of the release manifest makes Helm
    # delete it on the next upgrade. Use claimName for that.
    existingClaim: ""

    # Name of the PVC this chart creates and manages.
    # Default: <fullname>-config. Set it to keep a name from an older release.
    claimName: ""

    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: "1Gi"
    annotations: {}
    # Keep the PVC on `helm uninstall`. Losing it loses every torrent's state.
    retain: true

  # /downloads
  downloads:
    enabled: false

    # hostPath | pvc
    #
    # hostPath ties the data to one node. The chart refuses to render unless you
    # also set nodeSelector or affinity, because otherwise the pod can be
    # rescheduled elsewhere, DirectoryOrCreate silently makes an empty directory
    # there, and your torrents appear to vanish.
    #
    # Also make sure the directory is writable by PUID/PGID: DirectoryOrCreate
    # creates it as root:root 0755, which UID 1000 cannot write to.
    type: "hostPath"
    hostPath: "/media/k3s-data"

    # Directory: the pod refuses to start if hostPath does not exist.
    # DirectoryOrCreate: the kubelet creates an empty directory instead.
    #
    # Default Directory, because the empty-directory case is exactly the failure
    # described above. It catches a wrong path or a missing directory, but NOT a
    # disk that failed to mount after a reboot — the mount point is then a real
    # (empty) directory. For that, add an initContainer that checks for a marker
    # file.
    hostPathType: Directory

    # See the notes on existingClaim vs claimName under config above.
    existingClaim: ""
    claimName: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: "10Gi"
    annotations: {}
    retain: true

  # /watch — drop .torrent files here and Transmission picks them up.
  watch:
    enabled: false
    type: "hostPath"
    hostPath: ""

    # DirectoryOrCreate here, unlike downloads: a watch folder holds no data of
    # its own and an empty one is the normal state.
    hostPathType: DirectoryOrCreate

    # With type: pvc one of these must be set, or the rendered claimName would
    # be empty. See the notes under config for which to use.
    existingClaim: ""
    claimName: ""

# Required when persistence.downloads.type is hostPath (see above).
nodeSelector: {}
# kubernetes.io/hostname: k3s-node-1

tolerations: []
affinity: {}
priorityClassName: ""

podDisruptionBudget:
  # Off by default: with a single replica a PDB would block node drains.
  enabled: false
  minAvailable: ""
  maxUnavailable: 1

networkPolicy:
  enabled: false

  # WARNING: an empty list means "from anywhere". A NetworkPolicy ingress rule
  # with ports but no `from` matches every source in the cluster, so enabling
  # the policy with ingressFrom: [] restricts the port number and nothing else.
  #
  #   ingressFrom:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: ingress-nginx
  ingressFrom: []

  # Egress stays completely unrestricted while this list is empty — the chart
  # does not even declare the Egress policyType, because declaring it with no
  # rules would deny all outbound traffic.
  #
  # Restricting egress on a torrent client is mostly pointless: it has to reach
  # arbitrary peers on arbitrary ports, so any workable rule ends up allowing
  # 0.0.0.0/0. The exception is a VPN sidecar, where you genuinely want to allow
  # only the tunnel. That is the case this is here for.
  egress: []

  # Appends a DNS rule (kube-system :53 UDP+TCP) to the egress list above.
  # Ignored while egress is empty, since egress is unrestricted anyway.
  allowDNS: true

  # The peer port arrives on the node, not through the cluster network, so it is
  # covered by the hostPort and your router — not by this policy.

extraVolumes: []
extraVolumeMounts: []
initContainers: []
# Somewhere to put a VPN sidecar (gluetun and friends).
sidecars: []

# The `helm test` pod.
tests:
  image: busybox:1.36
  # Empty means env.PUID, falling back to 1000.
  runAsUser: ""
