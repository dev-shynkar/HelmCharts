{{- $p := .Values.persistence.config }}
{{- if and $p.enabled (not $p.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "transmission.configClaimName" . }}
  labels:
    {{- include "transmission.labels" . | nindent 4 }}
  {{- /*
    settings.json, resume files and statistics — losing this loses every torrent.
    retain wins over anything commonAnnotations sets on the same key, so keeping
    the volume can never be switched off by accident.
  */}}
  {{- $ann := merge (dict) ($p.annotations | default dict) (.Values.commonAnnotations | default dict) }}
  {{- if $p.retain }}
  {{- $_ := set $ann "helm.sh/resource-policy" "keep" }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $p.accessModes | nindent 4 }}
  {{- if $p.storageClassName }}
  {{- if eq $p.storageClassName "-" }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ $p.storageClassName }}
  {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
