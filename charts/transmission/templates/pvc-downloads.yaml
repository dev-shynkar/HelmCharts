{{- $dl := .Values.persistence.downloads }}
{{- if and $dl.enabled (eq $dl.type "pvc") (not $dl.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "transmission.downloadsClaimName" . }}
  labels:
    {{- include "transmission.labels" . | nindent 4 }}
  {{- /* retain wins over commonAnnotations on the same key. */}}
  {{- $ann := merge (dict) ($dl.annotations | default dict) (.Values.commonAnnotations | default dict) }}
  {{- if $dl.retain }}
  {{- $_ := set $ann "helm.sh/resource-policy" "keep" }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $dl.accessModes | nindent 4 }}
  {{- if $dl.storageClassName }}
  {{- if eq $dl.storageClassName "-" }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ $dl.storageClassName }}
  {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ $dl.size }}
{{- end }}
