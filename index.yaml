  transmission:
  - annotations:
      artifacthub.io/category: networking
      artifacthub.io/changes: |
        - kind: added
          description: Expose the BitTorrent peer port 51413 TCP+UDP via hostPort, plus the PEERPORT variable
        - kind: added
          description: RPC credentials from a Secret; without USER/PASS the web UI has no authentication at all
        - kind: added
          description: ServiceAccount, probes, resource defaults, optional /watch volume, NOTES, helm test and a values schema
        - kind: fixed
          description: Clear the hardcoded nameOverride/fullnameOverride that made every release use the same names and selector
        - kind: fixed
          description: Use Recreate strategy so upgrades do not deadlock on the ReadWriteOnce config volume
        - kind: fixed
          description: Require nodeSelector or affinity with hostPath downloads, which otherwise silently follow the pod to another node
        - kind: removed
          description: Drop the `namespace` value and metadata.namespace; Helm's --namespace is the single source of truth
      artifacthub.io/license: GPL-2.0-or-later
