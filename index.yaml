  transmission:
  - annotations:
      artifacthub.io/category: networking
      artifacthub.io/changes: |
        - kind: fixed
          description: Delete templates/pvc.yaml, a leftover that rendered both PVCs a second time without helm.sh/resource-policy and overwrote the real claim on every upgrade
        - kind: fixed
          description: Guard .Values.env against nil; hasKey on an emptied env map was a render-time panic
        - kind: fixed
          description: persistence.watch with type pvc rendered an empty claimName instead of failing with a useful message
        - kind: fixed
          description: hostPath downloads default to type Directory, so a missing path stops the pod instead of making every torrent look lost
        - kind: fixed
          description: Reject updateStrategy RollingUpdate while the peer hostPort or a ReadWriteOnce /config would deadlock it
        - kind: changed
          description: Drop all container capabilities and add back only what s6-overlay needs, plus seccompProfile RuntimeDefault
        - kind: added
          description: NetworkPolicy, commonLabels, commonAnnotations, startupProbe, terminationGracePeriodSeconds, persistence.*.hostPathType and a configurable helm test pod
        - kind: added
          description: Expose the BitTorrent peer port 51413 TCP+UDP via hostPort, plus the PEERPORT variable
        - kind: added
          description: RPC credentials from a Secret; without USER/PASS the web UI has no authentication at all
        - kind: added
          description: ServiceAccount, probes, resource defaults, optional /watch volume, NOTES, helm test and a values schema
        - kind: fixed
          description: Clear the hardcoded nameOverride/fullnameOverride that made every release use the same names and selector
        - kind: fixed
          description: Use Recreate strategy so upgrades do not deadlock on the ReadWriteOnce config volume
        - kind: fixed
          description: Require nodeSelector or affinity with hostPath downloads, which otherwise silently follow the pod to another node
        - kind: removed
          description: Drop the `namespace` value and metadata.namespace; Helm's --namespace is the single source of truth
      artifacthub.io/license: GPL-2.0-or-later
