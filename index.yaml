  go-ecoflow-exporter:
  - annotations:
      artifacthub.io/category: monitoring
      artifacthub.io/changes: |
        - kind: fixed
          description: Send DEBUG_ENABLED, the variable the exporter actually reads (DEBUG was a no-op)
        - kind: fixed
          description: Set serviceAccountName even when serviceAccount.create is false
        - kind: fixed
          description: Hash the referenced Secret's contents so credential rotation restarts the pod
        - kind: fixed
          description: Pass ECOFLOW_DEVICES and pretty names in REST mode too, not only MQTT
        - kind: added
          description: ServiceMonitor, PodDisruptionBudget, NetworkPolicy, NOTES.txt, helm test and a values schema
        - kind: added
          description: Expose SCRAPING_INTERVAL, MQTT ping/state-refresh intervals, METRIC_PREFIX and PROMETHEUS_PORT
        - kind: added
          description: "mqttStallRecovery: opt-in liveness probe that restarts the pod when the upstream MQTT collector wedges"
        - kind: changed
          description: Raise deviceOfflineThresholdSeconds to 180 so the upstream force-reconnect path fires far less often
        - kind: removed
          description: Drop prometheus.enabled and existingSecret.enabled; the former only ever produced a crash loop
        - kind: changed
          description: exporter.devices is now a list and exporter.devicesPrettyNames a map
      artifacthub.io/license: MIT
